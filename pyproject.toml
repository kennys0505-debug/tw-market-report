[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tw-market-report"
version = "0.1.0"
description = "Automated Taiwan stock market regime and extreme-sentiment report"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Codex"}]
dependencies = []

[project.scripts]
tw-market-report = "tw_market_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

