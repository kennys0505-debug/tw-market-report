$('#limits').innerHTML=['twse','tpex','combined'].map(k=>{const x=D.limits?.[k]||{};const name={twse:'上市',tpex:'上櫃',combined:'合併'}[k];return `<div class="limitbox"><div><div class="small">${name}／有效 ${num(x.eligible_count,0)} 家 <span class="pill">${x.universe_verified?'逐股核對':'官方摘要口徑'}</span></div><div><span class="limitnum state">${num(x.limit_up_count,0)}</span> 漲停　<span class="limitnum negative">${num(x.limit_down_count,0)}</span> 跌停</div><div><span class="pill">漲停 ${pct(x.limit_up_ratio)}</span><span class="pill">跌停 ${pct(x.limit_down_ratio)}</span></div></div><div class="small">5年分位 <b>${x.up_percentile_5y==null?'—':num(x.up_percentile_5y,0)+'%'}</b>／<b>${x.down_percentile_5y==null?'—':num(x.down_percentile_5y,0)+'%'}</b><br>全期分位 <b>${x.up_percentile_full==null?'—':num(x.up_percentile_full,0)+'%'}</b>／<b>${x.down_percentile_full==null?'—':num(x.down_percentile_full,0)+'%'}</b><br>排名 <b>${x.up_historical_rank??'—'}</b>／<b>${x.down_historical_rank??'—'}</b></div></div>`}).join('');
function lineChart(svg,rows,key,color,baseline){const vals=rows.map(r=>Number(r[key])).filter(Number.isFinite);if(vals.length<2){svg.innerHTML='<text x="450" y="110" text-anchor="middle" fill="currentColor" opacity=".55">歷史資料不足</text>';return}const min=Math.min(...vals,baseline??Infinity),max=Math.max(...vals,baseline??-Infinity);const pts=vals.map((v,i)=>`${30+i*840/(vals.length-1)},${195-(v-min)*160/Math.max(max-min,.0001)}`).join(' ');svg.innerHTML=`<line x1="30" y1="195" x2="870" y2="195" stroke="currentColor" opacity=".18"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="4" stroke-linejoin="round"/><text x="30" y="20" fill="currentColor" opacity=".65">${max.toFixed(1)}</text><text x="30" y="212" fill="currentColor" opacity=".65">${min.toFixed(1)}</text>`}
const hist=(D.history||[]).slice(-20);lineChart($('#score-chart'),hist,'composite_score','#20d0b0',50);
function bars(svg,rows){if(!rows.length){svg.innerHTML='<text x="450" y="110" text-anchor="middle" fill="currentColor" opacity=".55">歷史資料不足</text>';return}const max=Math.max(1,...rows.flatMap(r=>[Number(r.limit_up_count)||0,Number(r.limit_down_count)||0]));const group=840/rows.length;let s='<line x1="30" y1="195" x2="870" y2="195" stroke="currentColor" opacity=".18"/>';rows.forEach((r,i)=>{const x=30+i*group;const u=(Number(r.limit_up_count)||0)/max*160,d=(Number(r.limit_down_count)||0)/max*160;s+=`<rect x="${x}" y="${195-u}" width="${group*.34}" height="${u}" rx="2" fill="#20d0b0"/><rect x="${x+group*.4}" y="${195-d}" width="${group*.34}" height="${d}" rx="2" fill="#ff6b7a"/>`});svg.innerHTML=s}bars($('#limit-chart'),hist);
const zones=D.options_pressure_zones||{};const zrow=(name,arr)=>`<div class="small">${name}</div>`+(arr?.length?arr.map(x=>`<div class="zone"><b>${num(x.strike,0)}</b><span>OI ${num(x.open_interest,0)}</span></div>`).join(''):'<div class="empty">資料不足</div>');$('#options').innerHTML=zrow('Call集中區',zones.calls)+zrow('Put集中區',zones.puts)+`<div class="pill">Max Pain ${num(zones.max_pain,0)}</div>`;
$('#analogs').innerHTML=(D.historical_limit_analogs||[]).map(x=>`<tr><td>${esc((({twse:'上市',tpex:'上櫃',combined:'合併'}[x.market]||x.market)+'／'+x.trade_date))}</td><td>${num(x.limit_up_count,0)}</td><td>${num(x.limit_down_count,0)}</td><td>${ret(x.return_1d)}</td><td>${ret(x.return_5d)}</td><td>${ret(x.return_10d)}</td><td>${ret(x.return_20d)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">尚無足夠歷史資料</td></tr>';
$('#sources').innerHTML=(D.source_status||[]).map(x=>`<tr><td>${x.url?`<a href="${esc(x.url)}">${esc(x.name)}</a>`:esc(x.name)}</td><td><span class="status ${esc(x.status)}">${esc(x.status)}</span></td><td>${esc(x.as_of||'—')}</td><td>${esc(x.message||'')}</td></tr>`).join('');
</script></body></html>
