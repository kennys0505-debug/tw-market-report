<style>
:root{--bg:#08111f;--panel:#101d2d;--panel2:#152538;--text:#e8f0f8;--muted:#91a4b8;--line:#29405a;--teal:#20d0b0;--red:#ff6b7a;--amber:#ffbd59;--blue:#62a8ff;--shadow:0 16px 50px #0005}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% -10%,#17385b 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}

lock}.legend{display:flex;gap:15px;color:var(--muted);font-size:12px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:11px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-size:12px}.status{font-size:12px;font-weight:800;padding:3px 8px;border-radius:99px}.ready,.fixture{background:#20d0b022;color:#67e4ca}.partial,.stale{background:#ffbd5922;color:#ffd086}.blocked{background:#ff6b7a22;color:#ff98a2}.notice{padding:14px 16px;border:1px solid #ffbd5966;background:#ffbd5911;border-radius:12px;color:#ffdca5;margin-bottom:8px}.small{font-size:12px;color:var(--muted)}.footer{margin-top:28px;color:var(--muted);font-size:12px;text-align:center}.empty{color:var(--muted);padding:24px;text-align:center}.zone{padding:12px;background:#0a1623;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between}.mode-close{color:#75b6ff}.mode-premarket{color:#d7a3ff}

<body><main class="wrap">
<header class="top"><div><div class="eyebrow">Taiwan Market Regime Monitor</div><h1 class="title">台股每日多空、轉折與極端情緒報告</h1><div class="subtitle">將現貨、廣度、法人、槓桿、期權及海外半導體訊號拆開呈現。極端值是觀察條件，不等於反轉保證。</div></div><div class="stamp"><div id="mode"></div><strong id="trade-date"></strong><div id="generated"></div></div></header>
<div id="access-notice"></div>
<section class="grid heroes" id="heroes"></section>
<section class="grid two"><article class="panel"><h2>七模組市場溫度</h2><div id="modules"></div></article><article class="panel"><h2>訊號驅動因素</h2><div class="drivers"><div><div class="small">偏多</div><div id="positive"></div></div><div><div class="small">偏空</div><div id="negative"></div></div></div></article></section>
<section class="panel"><h2>漲跌停極端情緒</h2><div class="grid three" id="limits"></div><div style="margin-top:18px"><div class="legend"><span><i class="dot" style="background:var(--teal)"></i>漲停家數</span><span><i class="dot" style="background:var(--red)"></i>跌停家數</span></div><svg id="limit-chart" viewBox="0 0 900 220" role="img" aria-label="近20日漲跌停家數"></svg></div></section>
<section class="grid two"><article class="panel"><h2>綜合分數趨勢</h2><svg id="score-chart" viewBox="0 0 900 220" role="img" aria-label="綜合分數趨勢"></svg></article><article class="panel"><h2>選擇權 OI 集中壓力區</h2><div id="options"></div><p class="small">未平倉量無法辨認買賣方；此區只表示集中度，不代表必然支撐或壓力。</p></article></section>
<section class="panel"><h2>歷史漲跌停相似日</h2><div class="tablewrap"><table><thead><tr><th>市場／日期</th><th>漲停</th><th>跌停</th><th>1日</th><th>5日</th><th>10日</th><th>20日</th></tr></thead><tbody id="analogs"></tbody></table></div></section>
<section class="panel"><h2>資料來源與新鮮度</h2><div class="tablewrap"><table><thead><tr><th>來源</th><th>狀態</th><th>資料日期</th><th>訊息</th></tr></thead><tbody id="sources"></tbody></table></div></section>
<div class="footer">本工具是市場風險監測，不是個人化投資建議；不提供槓桿、放空或自動下單。</div>
</main>

<script>
const D=JSON.parse(document.getElementById('snapshot').textContent);const $=s=>document.querySelector(s);const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(v,d=1)=>v==null?'—':(v*100).toFixed(d)+'%';const num=(v,d=1)=>v==null?'—':Number(v).toLocaleString('zh-TW',{maximumFractionDigits:d});const ret=v=>v==null?'—':((v>=0?'+':'')+(v*100).toFixed(1)+'%');
$('#trade-date').textContent=D.trade_date;$('#generated').textContent='產生：'+new Date(D.generated_at).toLocaleString('zh-TW');$('#mode').innerHTML=D.report_mode==='close'?'<span class="mode-close">22:00 收盤報告</span>':'<span class="mode-premarket">08:15 盤前更新</span>';
const bad=(D.source_status||[]).filter(s=>!['ready','fixture'].includes(s.status));const notices=[];if(bad.length)notices.push('部分來源未完成：'+bad.map(s=>esc(s.name)).join('、')+'。缺值不會被當成零，信心已降級。');if(D.features?.limit_scoring_enabled===false)notices.push('漲跌停回測尚未通過十日命中率 +2 個百分點門檻，目前只作診斷顯示，不計入總分。');$('#access-notice').innerHTML=notices.map(v=>'<div class="notice">'+v+'</div>').join('');
const combined=(D.limits||{}).combined||{};const exposure=(D.model_exposure_range||[40,60]).join('–')+'%';const heroes=[['市場狀態',D.domestic_market_state,'state'],['綜合分數',num(D.composite_score,1)+'/100',''],['模型曝險',exposure,D.shadow_mode?'warning':''],['反轉階段',D.reversal_stage,D.reversal_stage==='極端觀察'?'warning':''],[D.report_mode==='premarket'?'海外風險':'訊號信心',D.report_mode==='premarket'?D.overnight_risk_state:D.confidence,'']];
$('#heroes').innerHTML=heroes.map(x=>`<div class="card"><div class="label">${esc(x[0])}</div><div class="value ${x[2]}">${esc(x[1])}</div><div class="hint">${x[0]==='模型曝險'&&D.shadow_mode?'影子模式／研究值':x[0]==='市場狀態'?'國內中期狀態':' '}</div></div>`).join('');
const labels={trend_breadth:'趨勢・廣度・量能',capital_flow:'法人與資金輪動',leverage_lending:'融資融券與借券',futures:'期貨與基差',options_volatility:'選擇權與波動',overseas:'海外半導體',valuation:'估值與位階'};
$('#modules').innerHTML=Object.entries(D.module_scores||{}).map(([k,v])=>`<div class="module"><div class="module-head"><span>${labels[k]||esc(k)}</span><b>${num(v,1)}</b></div><div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,v))}%"></div></div><div class="small">覆蓋 ${(100*(D.module_coverage?.[k]||0)).toFixed(0)}%</div></div>`).join('');
const drivers=(items,neg=false)=>items?.length?items.map(v=>`<div class="driver ${neg?'neg':''}">${esc(v)}</div>`).join(''):'<div class="empty">尚無足夠歷史資料</div>';$('#positive').innerHTML=drivers(D.positive_drivers);$('#negative').innerHTML=drivers(D.negative_drivers,true);
$('#limits').innerHTML=['twse','tpex','combined'].map(k=>{const x=D.limits?.[k]||{};const name={twse:'上市',tpex:'上櫃',combined:'合併'}[k];return `<div class="limitbox"><div><div class="small">${name}／有效 ${num(x.eligible_count,0)} 家 <span class="pill">${x.universe_verified?'逐股核對':'官方摘要口徑'}</span></div><div><span class="limitnum state">${num(x.limit_up_count,0)}</span> 漲停　<span class="limitnum negative">${num(x.limit_down_count,0)}</span> 跌停</div><div><span class="pill">漲停 ${pct(x.limit_up_ratio)}</span><span class="pill">跌停 ${pct(x.limit_down_ratio)}</span></div></div><div class="small">5年分位 <b>${x.up_percentile_5y==null?'—':num(x.up_percentile_5y,0)+'%'}</b>／<b>${x.down_percentile_5y==null?'—':num(x.down_percentile_5y,0)+'%'}</b><br>全期分位 <b>${x.up_percentile_full==null?'—':num(x.up_percentile_full,0)+'%'}</b>／<b>${x.down_percentile_full==null?'—':num(x.down_percentile_full,0)+'%'}</b><br>排名 <b>${x.up_historical_rank??'—'}</b>／<b>${x.down_historical_rank??'—'}</b></div></div>`}).join('');
function lineChart(svg,rows,key,color,baseline){const vals=rows.map(r=>Number(r[key])).filter(Number.isFinite);if(vals.length<2){svg.innerHTML='<text x="450" y="110" text-anchor="middle" fill="currentColor" opacity=".55">歷史資料不足</text>';return}const min=Math.min(...vals,baseline??Infinity),max=Math.max(...vals,baseline??-Infinity);const pts=vals.map((v,i)=>`${30+i*840/(vals.length-1)},${195-(v-min)*160/Math.max(max-min,.0001)}`).join(' ');svg.innerHTML=`<line x1="30" y1="195" x2="870" y2="195" stroke="currentColor" opacity=".18"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="4" stroke-linejoin="round"/><text x="30" y="20" fill="currentColor" opacity=".65">${max.toFixed(1)}</text><text x="30" y="212" fill="currentColor" opacity=".65">${min.toFixed(1)}</text>`}
const hist=(D.history||[]).slice(-20);lineChart($('#score-chart'),hist,'composite_score','#20d0b0',50);
function bars(svg,rows){if(!rows.length){svg.innerHTML='<text x="450" y="110" text-anchor="middle" fill="currentColor" opacity=".55">歷史資料不足</text>';return}const max=Math.max(1,...rows.flatMap(r=>[Number(r.limit_up_count)||0,Number(r.limit_down_count)||0]));const group=840/rows.length;let s='<line x1="30" y1="195" x2="870" y2="195" stroke="currentColor" opacity=".18"/>';rows.forEach((r,i)=>{const x=30+i*group;const u=(Number(r.limit_up_count)||0)/max*160,d=(Number(r.limit_down_count)||0)/max*160;s+=`<rect x="${x}" y="${195-u}" width="${group*.34}" height="${u}" rx="2" fill="#20d0b0"/><rect x="${x+group*.4}" y="${195-d}" width="${group*.34}" height="${d}" rx="2" fill="#ff6b7a"/>`});svg.innerHTML=s}bars($('#limit-chart'),hist);
const zones=D.options_pressure_zones||{};const zrow=(name,arr)=>`<div class="small">${name}</div>`+(arr?.length?arr.map(x=>`<div class="zone"><b>${num(x.strike,0)}</b><span>OI ${num(x.open_interest,0)}</span></div>`).join(''):'<div class="empty">資料不足</div>');$('#options').innerHTML=zrow('Call集中區',zones.calls)+zrow('Put集中區',zones.puts)+`<div class="pill">Max Pain ${num(zones.max_pain,0)}</div>`;
$('#analogs').innerHTML=(D.historical_limit_analogs||[]).map(x=>`<tr><td>${esc((({twse:'上市',tpex:'上櫃',combined:'合併'}[x.market]||x.market)+'／'+x.trade_date))}</td><td>${num(x.limit_up_count,0)}</td><td>${num(x.limit_down_count,0)}</td><td>${ret(x.return_1d)}</td><td>${ret(x.return_5d)}</td><td>${ret(x.return_10d)}</td><td>${ret(x.return_20d)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">尚無足夠歷史資料</td></tr>';
$('#sources').innerHTML=(D.source_status||[]).map(x=>`<tr><td>${x.url?`<a href="${esc(x.url)}">${esc(x.name)}</a>`:esc(x.name)}</td><td><span class="status ${esc(x.status)}">${esc(x.status)}</span></td><td>${esc(x.as_of||'—')}</td><td>${esc(x.message||'')}</td></tr>`).join('');
</script></body></html>
