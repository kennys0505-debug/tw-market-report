name: Publish dashboard layout

on:
  push:
    branches: [main]
    paths:
      - src/tw_market_report/render.py
      - src/tw_market_report/presentation.py
      - src/tw_market_report/technical.py
      - src/tw_market_report/refresh_dashboard.py
      - .github/workflows/dashboard.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dashboard-layout-publication
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      # Render only saved data. Do not run collectors, modify history, or notify LINE.
      - run: python -m tw_market_report.refresh_dashboard --previous-archive docs/archive
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
