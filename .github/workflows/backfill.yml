name: Backfill market history

on:
  workflow_dispatch:
    inputs:
      start:
        description: Start date (YYYY-MM-DD)
        required: true
        default: "2010-01-01"
      end:
        description: End date (YYYY-MM-DD)
        required: true
      delay:
        description: Seconds between official API requests
        required: true
        default: "0.35"

permissions:
  contents: write

concurrency:
  group: tw-market-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and verify
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m unittest discover -s tests -v
      - name: Backfill official limit statistics
        run: >-
          tw-market-report backfill
          --start "${{ inputs.start }}"
          --end "${{ inputs.end }}"
          --delay "${{ inputs.delay }}"
      - name: Recalculate limit-signal validation gate
        run: tw-market-report backtest
      - name: Persist history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/history.jsonl "$RUNNER_TEMP/backfill-history.jsonl"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            tw-market-report merge-history \
              --output data/history.jsonl \
              "$RUNNER_TEMP/backfill-history.jsonl"
            tw-market-report backtest
            git add -A data
            if git diff --cached --quiet; then
              echo "No history changes"
              exit 0
            fi
            git commit -m "data: backfill ${{ inputs.start }} through ${{ inputs.end }}"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main changed during persistence; retrying ($attempt/5)"
          done
          echo "Unable to persist history after 5 attempts" >&2
          exit 1
