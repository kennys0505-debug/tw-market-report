name: Backfill ten-year free history

on:
  workflow_dispatch:
    inputs:
      start:
        description: Start date (YYYY-MM-DD)
        required: true
        default: "2016-08-01"
      end:
        description: End date (YYYY-MM-DD)
        required: true
        default: "2026-08-06"
      delay:
        description: Seconds between per-session request groups
        required: true
        default: "0.50"

permissions:
  contents: write

concurrency:
  group: tw-market-ten-year-backfill
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.matrix.outputs.years }}
    steps:
      - id: matrix
        shell: python
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          import json, os
          start_year = int(os.environ["START"][:4])
          end_year = int(os.environ["END"][:4])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("years=" + json.dumps(list(range(start_year, end_year + 1))) + "\n")

  backfill:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: ${{ fromJSON(needs.prepare.outputs.years) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and verify
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m unittest discover -s tests -v
      - id: dates
        shell: python
        env:
          REQUEST_START: ${{ inputs.start }}
          REQUEST_END: ${{ inputs.end }}
          YEAR: ${{ matrix.year }}
        run: |
          import os
          from datetime import date
          year = int(os.environ["YEAR"])
          start = max(date.fromisoformat(os.environ["REQUEST_START"]), date(year, 1, 1))
          end = min(date.fromisoformat(os.environ["REQUEST_END"]), date(year, 12, 31))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"start={start.isoformat()}\nend={end.isoformat()}\n")
      - name: Backfill normalized free history
        run: >-
          tw-market-report backfill
          --start "${{ steps.dates.outputs.start }}"
          --end "${{ steps.dates.outputs.end }}"
          --delay "${{ inputs.delay }}"
          --output "artifacts/history-${{ matrix.year }}.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: history-${{ matrix.year }}
          path: artifacts/history-${{ matrix.year }}.jsonl
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: backfill
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: history-*
          path: artifacts
      - name: Merge chunks and validate limit signal
        run: |
          tw-market-report merge-history --output data/history.jsonl artifacts/history-*/history-*.jsonl
          tw-market-report backtest
      - name: Persist normalized history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/history.jsonl "$RUNNER_TEMP/backfill-history.jsonl"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            tw-market-report merge-history \
              --output data/history.jsonl \
              "$RUNNER_TEMP/backfill-history.jsonl"
            tw-market-report backtest
            git add data/history.jsonl data/backtest.json
            if git diff --cached --quiet; then
              echo "No history changes"
              exit 0
            fi
            git commit -m "data: backfill ten-year free history"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main changed during persistence; retrying ($attempt/5)"
          done
          echo "Unable to persist history after 5 attempts" >&2
          exit 1
