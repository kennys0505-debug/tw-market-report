name: Taiwan market report

on:
  schedule:
    # Start a few minutes before the delivery target and avoid GitHub's busiest
    # :00/:15 schedule slots, where scheduled workflows can be delayed.
    - cron: "7 0 * * 1-5" # target: about 08:15 Asia/Taipei
    - cron: "53 13 * * 1-5" # target: about 22:00 Asia/Taipei
    # Bounded backup windows; actual execution time selects the publication slot.
    - cron: "23,53 0-2,14-18 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/report.yml
      - src/tw_market_report/presentation.py
      - src/tw_market_report/scheduled_report.py
      - tests/test_presentation.py
      - tests/test_scheduled_report.py
  workflow_dispatch:
    inputs:
      mode:
        description: Report mode
        required: true
        default: auto
        type: choice
        options: [auto, close, premarket]
      notify:
        description: Send LINE notification if this slot has not been sent
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # One writer for latest.json, history and Pages across all report modes.
  group: market-report-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build or skip actual publication slot
        id: report
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_MODE: ${{ inputs.mode || 'auto' }}
          REQUESTED_NOTIFY: ${{ inputs.notify }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          REPORT_URL: ${{ vars.REPORT_URL }}
        run: |
          ARGS=(--mode "$REQUESTED_MODE" --github-output "$GITHUB_OUTPUT")
          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            ARGS+=(--force)
          fi
          if [[ "$EVENT_NAME" == "schedule" && ( "$EVENT_SCHEDULE" == "7 0 * * 1-5" || "$EVENT_SCHEDULE" == "53 13 * * 1-5" ) ]] || [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_NOTIFY" == "true" ]]; then
            ARGS+=(--notify)
          fi
          # Backups and code-triggered deployments are silent.
          python -m tw_market_report.scheduled_report "${ARGS[@]}"

      - name: Persist history and generated report
        if: steps.report.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "market-report-bot"
          git config user.email "market-report-bot@users.noreply.github.com"
          git add -A data docs
          if ! git diff --cached --quiet; then
            git commit -m "data: update ${{ steps.report.outputs.mode }} report [skip ci]"
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5
        if: steps.report.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.report.outputs.publish == 'true'
        with:
          # Retries retain earlier artifacts; select this attempt unambiguously.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs
      - name: Deploy GitHub Pages
        if: steps.report.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
